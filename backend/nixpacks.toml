[phases.setup]
nixPkgs = ["python312", "uv"]

[phases.install]
cmds = [
    "uv sync --frozen --no-dev"
]

[variables]
PYTHONUNBUFFERED = "1"
PIP_NO_CACHE_DIR = "1"

[start]
cmd = "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-9001}"

[phases.build]
cmds = [
    "echo 'Build completed successfully'"
]

[deploy]
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10