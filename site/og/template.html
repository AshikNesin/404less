<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f6f6f7;
        font-family: "Inter Display", "Inter", system-ui, sans-serif;
        color: #1f1f23;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "cv11", "ss01";
      }
      .wrap {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(31, 31, 35, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(31, 31, 35, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%);
      }
      .brand {
        position: absolute;
        left: 64px;
        top: 56px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 44px;
        height: 44px;
      }
      .brand-word span {
        color: #6f6f7a;
        font-weight: 500;
      }
      .title {
        position: absolute;
        left: 64px;
        top: 190px;
        width: 640px;
        font-size: 60px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.04;
      }
      .title.sm {
        font-size: 54px;
      }
      .sub {
        position: absolute;
        left: 64px;
        width: 600px;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 24px;
        color: #6f6f7a;
        letter-spacing: -0.01em;
        line-height: 1.4;
      }
      .foot {
        position: absolute;
        left: 64px;
        bottom: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 20px;
        color: #6f6f7a;
      }
      .foot .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e6e6ea;
        background: #fff;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 17px;
        font-weight: 500;
        color: #44444c;
      }
      .foot .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2f8a5b;
      }
      .shot {
        position: absolute;
        left: 760px;
        top: 120px;
        width: 760px;
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #e6e6ea;
        box-shadow:
          0 40px 80px -30px rgba(20, 20, 30, 0.35),
          0 2px 6px rgba(20, 20, 30, 0.06);
      }
      .shot .bar {
        height: 36px;
        background: #f3f3f5;
        border-bottom: 1px solid #e6e6ea;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 14px;
      }
      .shot .bar i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d9d9de;
      }
      .shot img {
        display: block;
        width: 100%;
      }
      .widget {
        position: absolute;
        left: 740px;
        top: 150px;
        width: 460px;
        border-radius: 16px;
        box-shadow: 0 40px 80px -30px rgba(20, 20, 30, 0.35);
      }
      .term {
        position: absolute;
        left: 740px;
        top: 140px;
        width: 620px;
        background: #1a1a1f;
        border: 1px solid #2a2a31;
        border-radius: 16px;
        padding: 28px 32px;
        color: #f4f4f5;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        line-height: 1.75;
        white-space: pre;
        box-shadow: 0 40px 80px -30px rgba(20, 20, 30, 0.5);
      }
      .term .m {
        color: #9ca3af;
      }
      .term .s {
        color: #86efac;
      }
      .term .k {
        color: #a5b4fc;
      }
      .deploy {
        position: absolute;
        left: 760px;
        top: 150px;
        width: 520px;
        background: #fff;
        border: 1px solid #e6e6ea;
        border-radius: 16px;
        padding: 28px 32px;
        box-shadow: 0 40px 80px -30px rgba(20, 20, 30, 0.3);
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        line-height: 1.8;
        color: #1f1f23;
        white-space: pre;
      }
      .deploy .m {
        color: #9a9aa3;
      }
      .deploy .c {
        color: #9a9aa3;
      }
      .deploy .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #1f1f23;
        color: #fff;
        border-radius: 10px;
        padding: 10px 18px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 18px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="grid"></div>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1f1f23" />
          <g
            fill="none"
            stroke="#fff"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17.5 7.5v18" />
            <path d="M17.5 7.5 7.5 19.5h17" />
            <path d="m21.5 16 3.5 3.5-3.5 3.5" />
          </g>
        </svg>
        <span class="brand-word">404<span>less</span></span>
      </div>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
      <div class="foot">
        <span class="pill"><span class="dot"></span>Open source</span
        ><span class="pill">Cloudflare free tier</span><span>404less.com</span>
      </div>
      <div id="visual"></div>
    </div>
  </body>
</html>
